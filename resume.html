<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Resume</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="resume-form">

  <h1>Create Your Resume</h1>

  <input type="text" id="name" placeholder="Full Name">

  <input type="text" id="email" placeholder="Email">

  <input type="text" id="phone" placeholder="Phone Number">

  <input type="text" id="education" placeholder="Education">

  <input type="text" id="skills" placeholder="Skills">

  <textarea id="experience" placeholder="Work Experience"></textarea>

  <textarea id="about" placeholder="About You"></textarea>

  <button onclick="createResume()">Create Resume</button>

</div>

<div id="resumePreview"></div>

<script src="script.js"></script>

</body>
</html>
