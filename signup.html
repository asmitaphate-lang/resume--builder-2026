<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Resume Builder</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-box">
  <h1>Create Account</h1>
  <p>Create your free account</p>

  <input type="text" id="signupName" placeholder="Enter Name">
  <input type="email" id="signupEmail" placeholder="Enter Email">
  <input type="password" id="signupPassword" placeholder="Create Password">

  <button onclick="signup()">Create Account</button>

  <p id="signupMessage"></p>

  <p>Already have an account?</p>
  <a href="login.html">Login</a>
</div>

<script src="script.js"></script>

</body>
</html>
