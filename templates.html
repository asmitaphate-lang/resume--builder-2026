<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Template</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="template-container">

  <h1>Select Resume Template</h1>
  <p>Choose your favourite template and colour</p>

  <div class="templates">

    <div class="template-card">
      <div class="template-preview blue">
        <h2>Modern</h2>
        <p>Your Name</p>
        <p>Software Developer</p>
      </div>
      <button onclick="selectTemplate('blue')">Choose Blue</button>
    </div>

    <div class="template-card">
      <div class="template-preview green">
        <h2>Professional</h2>
        <p>Your Name</p>
        <p>Web Developer</p>
      </div>
      <button onclick="selectTemplate('green')">Choose Green</button>
    </div>

    <div class="template-card">
      <div class="template-preview purple">
        <h2>Creative</h2>
        <p>Your Name</p>
        <p>Designer</p>
      </div>
      <button onclick="selectTemplate('purple')">Choose Purple</button>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
